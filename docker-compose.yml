version: "3"
services:
  tg_search_bot:
    image: python:3.10
    restart: always
    working_dir: /app
    environment:
      - TZ=Asia/Shanghai
    network_mode: "host"
    volumes:
      - .:/app
      - ~/.tg_search_bot:/root/.tg_search_bot
    command: >
      sh -c "
      pip3 install -U -r requirements.txt && 
      python3 bot.py"
